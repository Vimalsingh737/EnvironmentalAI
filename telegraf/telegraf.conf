# ============================================================
# ENVIRONMENTAL AI - TELEGRAF CONFIG
# ============================================================


# ============================================================
# FIRE DATA
# ============================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["environment/fire"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "fire"

    # --------------------------------------------------------
    # FIRE PROBABILITY
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fire_probability"
      type = "float"

    # --------------------------------------------------------
    # FIRE PROBABILITY PERCENT
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fire_probability_percent"
      type = "float"

    # --------------------------------------------------------
    # FIRE STATUS
    # SAFE / FIRE / etc.
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fire_status"
      type = "string"

    # --------------------------------------------------------
    # FLAME SENSOR 1
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "flame1"
      type = "float"

    # --------------------------------------------------------
    # FLAME SENSOR 2
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "flame2"
      type = "float"

    # --------------------------------------------------------
    # HUMIDITY
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humidity"
      type = "float"

    # --------------------------------------------------------
    # SENSOR ID
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "id"
      type = "int"

    # --------------------------------------------------------
    # MQ7
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mq7"
      type = "float"

    # --------------------------------------------------------
    # TEMPERATURE
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature"
      type = "float"

    # --------------------------------------------------------
    # TIMESTAMP
    # --------------------------------------------------------

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "timestamp"
      type = "string"





# ============================================================
# FLOOD DATA
# ============================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["environment/flood"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "flood"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "node_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_depth_cm"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_flow_ml_min"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk_score"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk_type"
      type = "string"


# ============================================================
# FIRE AREA PREDICTION
# ============================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["environment/fire_prediction"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "fire_prediction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "node_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "predicted_area_hectares"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "predicted_area_km2"
      type = "float"


# ============================================================
# LANDSLIDE DATA
# ============================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["environment/landslide"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "landslide"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "node_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "latitude"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "longitude"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "movement"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rainfall"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_moisture"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "persistent_movement"
      type = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk_score"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk_level"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hazard"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "prediction"
      type = "string"


# ============================================================
# AIR QUALITY DATA
# ============================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["environment/air"]
  qos = 1
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_quality"

    # node_id is stored as a TAG
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "node_id"

    # Air-quality fields
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dust"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "label"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mq2"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mq7"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "risk"
      type = "float"


# ============================================================
# INFLUXDB OUTPUT
# ============================================================

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "$INFLUX_TOKEN"
  organization = "EnvironmentalAI"
  bucket = "environment_data"